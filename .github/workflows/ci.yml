name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check the code compiles
        run: python3 -m compileall -q filefinder run.py

      - name: Install build tools and the libraries the app needs to start
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv curl libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Build the .deb
        run: sh packaging/build-deb.sh

      - name: Build the AppImage
        run: sh packaging/build-appimage.sh

      - name: Check the AppImage starts
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          chmod +x dist/File_Finder-x86_64.AppImage
          code=0
          timeout 15 dist/File_Finder-x86_64.AppImage || code=$?
          [ "$code" -eq 124 ]

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.deb
            dist/*.AppImage

  install:
    needs: build
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "ubuntu:26.04", "debian:13", "linuxmintd/mint22-amd64"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: packages

      - name: Install and start on ${{ matrix.image }}
        run: |
          deb="$(ls packages/*.deb)"
          docker run --rm --user root -v "$PWD:/work" ${{ matrix.image }} \
              sh /work/packaging/smoke-test.sh "/work/$deb"
              